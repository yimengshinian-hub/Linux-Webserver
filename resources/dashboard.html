<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>STM32MP157 系统监控</title>
<style>
:root{
  --bg:#0c0f14;
  --card:#151a22;
  --line:#222b38;
  --txt:#e8eef7;
  --muted:#78879d;
  --accent:#2fe3c4;
  --accent-2:#1b8f7c;
  --ok:#35d07f;
  --bad:#ff6b6b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  padding:26px 18px 44px;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.wrap{max-width:1060px;margin:0 auto}

header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:19px;font-weight:600;letter-spacing:.2px}
.tag{
  font-size:11px;color:var(--muted);border:1px solid var(--line);
  padding:3px 9px;border-radius:20px;font-family:ui-monospace,Consolas,monospace;
}
.conn{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(53,208,127,.14)}
.dot.off{background:var(--bad);box-shadow:0 0 0 3px rgba(255,107,107,.14)}

.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
@media(max-width:820px){.cards{grid-template-columns:repeat(2,1fr)}}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px 16px 14px;position:relative;overflow:hidden;
}
.card::after{
  content:"";position:absolute;left:0;top:0;width:100%;height:2px;
  background:linear-gradient(90deg,var(--accent),transparent 70%);opacity:.55;
}
.card .lbl{font-size:12px;color:var(--muted);margin-bottom:10px;letter-spacing:.3px}
.card .val{
  font-family:ui-monospace,Consolas,"SF Mono",monospace;
  font-size:30px;font-weight:600;line-height:1;letter-spacing:-.5px;
  color:var(--txt);font-variant-numeric:tabular-nums;
}
.card .val.small{font-size:21px}
.card .unit{font-size:12px;color:var(--muted);margin-top:8px;font-family:ui-monospace,Consolas,monospace}
.card.na .val{color:var(--muted);font-size:20px;font-weight:400}
.card.na::after{background:linear-gradient(90deg,var(--muted),transparent 70%);opacity:.22}

.panel{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px 16px 10px;margin-bottom:14px;
}
.panel-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.panel-head .t{font-size:13px;color:var(--txt);font-weight:500}
.panel-head .s{font-size:12px;color:var(--muted);font-family:ui-monospace,Consolas,monospace}
.panel-head .now{
  margin-left:auto;font-family:ui-monospace,Consolas,monospace;
  font-size:15px;color:var(--accent);font-variant-numeric:tabular-nums;
}
canvas{display:block;width:100%;height:250px}

.ctrl{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:4px;gap:4px}
.seg button{
  border:0;background:transparent;color:var(--muted);font-size:13px;
  padding:9px 22px;border-radius:8px;cursor:pointer;font-family:inherit;
  transition:background .16s,color .16s;
}
.seg button:hover:not(:disabled){color:var(--txt);background:#1d2530}
.seg button.on{background:var(--accent-2);color:#04231f;font-weight:600}
.seg button.off-on{background:#8f2b2b;color:#ffe6e6;font-weight:600}
.seg button:disabled{opacity:.45;cursor:not-allowed}

.pill{
  display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);
  border:1px solid var(--line);padding:7px 13px;border-radius:20px;background:var(--card);
}
.pill .d{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.pill.on{color:#8bf0c9;border-color:#1d5c4f}
.pill.on .d{background:var(--accent);box-shadow:0 0 0 3px rgba(47,227,196,.15)}

.dbg{
  margin-top:12px;font-size:11px;color:#4b5768;
  font-family:ui-monospace,Consolas,monospace;line-height:1.7;
  word-break:break-all;
}
.dbg.err{color:#ff8a8a}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
  background:#2a1518;border:1px solid #5c2a2f;color:#ffb4b4;
  padding:10px 18px;border-radius:10px;font-size:12.5px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

footer{margin-top:18px;font-size:11px;color:#4b5768;text-align:center;font-family:ui-monospace,Consolas,monospace;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>系统监控面板</h1>
    <span class="tag">STM32MP157 / ARM Cortex-A7</span>
    <div class="conn"><span class="dot" id="connDot"></span><span id="connTxt">已连接</span></div>
  </header>

  <div class="cards">
    <div class="card" id="cardFreq">
      <div class="lbl">CPU 主频</div>
      <div class="val" id="vFreq">--</div>
      <div class="unit">MHz</div>
    </div>
    <div class="card" id="cardMem">
      <div class="lbl">内存使用率</div>
      <div class="val" id="vMem">--</div>
      <div class="unit">%</div>
    </div>
    <div class="card" id="cardUp">
      <div class="lbl">运行时长</div>
      <div class="val small" id="vUp">--</div>
      <div class="unit">自上次启动</div>
    </div>
    <div class="card na" id="cardTemp">
      <div class="lbl">CPU 温度</div>
      <div class="val" id="vTemp">N/A</div>
      <div class="unit" id="uTemp">传感器未开放</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <span class="t">主频实时曲线</span>
      <span class="s" id="chartSub">最近 60 个采样点</span>
      <span class="now" id="chartNow">-- MHz</span>
    </div>
    <canvas id="chart"></canvas>
  </div>

  <div class="panel" style="padding-bottom:16px">
    <div class="panel-head" style="margin-bottom:14px">
      <span class="t">板载指示灯</span>
      <span class="s">/sys/class/leds/red/brightness</span>
    </div>
    <div class="ctrl">
      <div class="seg">
        <button id="btnOn">开启</button>
        <button id="btnOff">关闭</button>
      </div>
      <span class="pill" id="ledPill"><span class="d"></span><span id="ledTxt">指示灯已关闭</span></span>
    </div>
    <div class="dbg" id="ledDbg">就绪</div>
  </div>

  <footer id="foot">正在探测接口…</footer>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ============================================================
 * 只需要改这里。如果留空/写错，页面会自动探测可用接口。
 * ============================================================ */
const CONFIG = {
  statusUrl: "/api/sysinfo",  // 系统状态接口
  ledUrl:    "/api/gpio",     // LED 控制接口（带 ?action=on|off）
  pollMs:    1000,            // 轮询间隔
  maxPoints: 60               // 曲线保留点数
};
/* ============================================================ */

/* 探测候选：按顺序尝试，命中后记住 */
const STATUS_CANDIDATES = [
  "/api/sysinfo", "/api/status", "/api/monitor", "/api/system",
  "/api/sys", "/status", "/sysinfo", "/monitor", "/system", "/api/sensors"
];
const LED_CANDIDATES = [
  "/api/gpio", "/api/led", "/api/led/control", "/api/leds", "/api/gpio/led", "/api/light", "/led"
];

/* LED 请求格式候选：依次尝试，直到接口返回 2xx 且业务状态不是 error
 * 第一位是你当前后端用的：GET /api/gpio?action=on|off */
const LED_MODES = [
  { method: "GET",  ct: null, query: on => "?action=" + (on ? "on" : "off") },
  { method: "GET",  ct: null, query: on => "?state=" + (on ? "on" : "off") },
  { method: "GET",  ct: null, query: on => "?on=" + (on ? 1 : 0) },
  { method: "POST", ct: "application/json", body: on => JSON.stringify({ on: on }) },
  { method: "POST", ct: "application/json", body: on => JSON.stringify({ state: on ? 1 : 0 }) },
  { method: "POST", ct: "application/x-www-form-urlencoded", body: on => "action=" + (on ? "on" : "off") },
  { method: "POST", ct: null, body: on => (on ? "1" : "0") }
];

const IS_FILE = location.protocol === "file:" || location.search.indexOf("demo=1") >= 0;

const $ = id => document.getElementById(id);
const canvas = $("chart");
const ctx = canvas.getContext("2d");

let history = [];
let pollTimer = null;
let ledState = false;
let statusUrl = CONFIG.statusUrl;
let ledUrl = CONFIG.ledUrl;
let ledModeIdx = 0;
let statusProbed = false;
let ledProbed = false;
let busy = false;

/* ---------------- 工具函数 ---------------- */
function num(v) {
  if (v === null || v === undefined || v === "") return null;
  const n = typeof v === "number" ? v : parseFloat(v);
  return Number.isFinite(n) ? n : null;
}

function pick(obj, keys) {
  for (const k of keys) {
    if (obj && obj[k] !== undefined && obj[k] !== null && obj[k] !== "") return obj[k];
  }
  return null;
}

function fmtUptime(sec) {
  if (sec === null || sec < 0) return "--";
  const d = Math.floor(sec / 86400);
  const h = Math.floor(sec % 86400 / 3600);
  const m = Math.floor(sec % 3600 / 60);
  if (d > 0) return d + "天" + h + "小时" + m + "分";
  if (h > 0) return h + "小时" + m + "分";
  return m + "分";
}

function setConn(ok) {
  $("connDot").className = "dot" + (ok ? "" : " off");
  $("connTxt").textContent = ok ? "已连接" : "连接断开";
}

function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 2600);
}

function ledDbg(msg, isErr) {
  const el = $("ledDbg");
  if (!el) return;
  el.textContent = msg;
  el.className = "dbg" + (isErr ? " err" : "");
}

/* ---------------- 数据归一化 ---------------- */
function normalize(d) {
  let freq = num(pick(d, ["cpuFreq", "freq", "cpu_freq", "cpuMHz", "cpu_mhz", "frequency"]));
  if (freq !== null && freq > 10000) freq = freq / 1000;   // 后端给 kHz 也能认
  if (freq !== null && (freq <= 0 || freq > 10000)) freq = null;

  let mem = num(pick(d, ["memUsage", "mem", "mem_usage", "memory", "memPercent", "mem_percent"]));
  if (mem !== null && (mem < 0 || mem > 100)) mem = null;

  /* uptime 可能是数字，也可能是 {seconds, text} 嵌套对象 */
  const upRaw = pick(d, ["uptime", "uptimeSec", "uptime_sec", "runtime", "runTime", "up"]);
  let up = null;
  if (upRaw && typeof upRaw === "object") {
    up = num(upRaw.seconds !== undefined ? upRaw.seconds : upRaw.sec);
  } else {
    up = num(upRaw);
  }
  if (up !== null && up < 0) up = null;

  /* 温度：后端可能给 -1、null 或垃圾值，一律判无效 */
  let temp = num(pick(d, ["cpuTemp", "temp", "cpu_temp", "temperature"]));
  if (temp !== null && temp > 1000) temp = temp / 1000;
  if (temp !== null && (temp <= 0 || temp >= 150)) temp = null;

  const led = pick(d, ["led", "ledOn", "led_on", "light"]);
  return { freq, mem, up, temp, led: typeof led === "boolean" ? led : null };
}

/* ---------------- 渲染 ---------------- */
function render(st) {
  $("vFreq").textContent = st.freq === null ? "N/A" : st.freq.toFixed(0);
  $("cardFreq").classList.toggle("na", st.freq === null);

  $("vMem").textContent = st.mem === null ? "N/A" : st.mem.toFixed(1);
  $("cardMem").classList.toggle("na", st.mem === null);

  $("vUp").textContent = st.up === null ? "N/A" : fmtUptime(st.up);
  $("cardUp").classList.toggle("na", st.up === null);

  const tCard = $("cardTemp");
  if (st.temp === null) {
    tCard.classList.add("na");
    $("vTemp").textContent = "N/A";
    $("uTemp").textContent = "传感器未开放";
  } else {
    tCard.classList.remove("na");
    $("vTemp").textContent = st.temp.toFixed(1);
    $("uTemp").textContent = "摄氏度";
  }

  $("chartNow").textContent = st.freq === null ? "-- MHz" : st.freq.toFixed(0) + " MHz";

  if (st.led !== null) setLedUI(st.led);

  if (st.freq !== null) {
    history.push(st.freq);
    if (history.length > CONFIG.maxPoints) history.shift();
  }
  drawChart();
}

function setLedUI(on) {
  ledState = on;
  $("ledPill").className = "pill" + (on ? " on" : "");
  $("ledTxt").textContent = on ? "指示灯已开启" : "指示灯已关闭";
  $("btnOn").className = on ? "on" : "";
  $("btnOff").className = on ? "" : "off-on";
}

function setBusy(v) {
  busy = v;
  $("btnOn").disabled = v;
  $("btnOff").disabled = v;
}

/* ---------------- 曲线绘制 ---------------- */
function drawChart() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  if (rect.width === 0) return;
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const W = rect.width, H = rect.height;
  const padL = 46, padR = 12, padT = 14, padB = 22;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;

  ctx.clearRect(0, 0, W, H);

  const vals = history.filter(v => v !== null);
  if (vals.length === 0) {
    ctx.fillStyle = "#4b5768";
    ctx.font = "12px ui-monospace,Consolas,monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("等待数据…", W / 2, H / 2);
    return;
  }

  let lo = Math.min.apply(null, vals);
  let hi = Math.max.apply(null, vals);
  const span = hi - lo;
  const pad = span < 1 ? Math.max(hi * 0.05, 1) : span * 0.18;
  lo = Math.max(0, lo - pad);
  hi = hi + pad;

  const xAt = i => padL + (CONFIG.maxPoints <= 1 ? 0 : (i / (CONFIG.maxPoints - 1)) * plotW);
  const yAt = v => padT + plotH - ((v - lo) / (hi - lo)) * plotH;

  /* 网格与 Y 轴刻度 */
  ctx.strokeStyle = "#1b222d";
  ctx.lineWidth = 1;
  ctx.fillStyle = "#5a6779";
  ctx.font = "11px ui-monospace,Consolas,monospace";
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";
  const rows = 4;
  for (let r = 0; r <= rows; r++) {
    const v = lo + (hi - lo) * (r / rows);
    const y = Math.round(yAt(v)) + 0.5;
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(W - padR, y);
    ctx.stroke();
    ctx.fillText(v.toFixed(0), padL - 8, y);
  }

  const pts = history.map((v, i) => ({ x: xAt(i), y: yAt(v) }));

  /* Catmull-Rom 转贝塞尔，做平滑 */
  const path = new Path2D();
  path.moveTo(pts[0].x, pts[0].y);
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[i + 2] || p2;
    const t = 0.75;
    path.bezierCurveTo(
      p1.x + (p2.x - p0.x) / 6 * t, p1.y + (p2.y - p0.y) / 6 * t,
      p2.x - (p3.x - p1.x) / 6 * t, p2.y - (p3.y - p1.y) / 6 * t,
      p2.x, p2.y
    );
  }

  /* 渐变填充 */
  const grad = ctx.createLinearGradient(0, padT, 0, padT + plotH);
  grad.addColorStop(0, "rgba(47,227,196,0.26)");
  grad.addColorStop(1, "rgba(47,227,196,0)");
  const area = new Path2D(path);
  area.lineTo(pts[pts.length - 1].x, padT + plotH);
  area.lineTo(pts[0].x, padT + plotH);
  area.closePath();
  ctx.fillStyle = grad;
  ctx.fill(area);

  ctx.strokeStyle = "#2fe3c4";
  ctx.lineWidth = 2;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  ctx.stroke(path);

  /* 末端光点 */
  const last = pts[pts.length - 1];
  ctx.beginPath();
  ctx.arc(last.x, last.y, 7, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(47,227,196,0.18)";
  ctx.fill();
  ctx.beginPath();
  ctx.arc(last.x, last.y, 3.5, 0, Math.PI * 2);
  ctx.fillStyle = "#2fe3c4";
  ctx.fill();
}

/* ---------------- 接口探测 ---------------- */
function looksLikeStatus(d) {
  if (!d || typeof d !== "object") return false;
  return ("cpuTemp" in d) || ("temp" in d) || ("memUsage" in d) ||
         ("uptime" in d) || ("cpuFreq" in d) || ("mem" in d);
}

async function fetchStatus() {
  const list = statusProbed
    ? [statusUrl]
    : [statusUrl].concat(STATUS_CANDIDATES.filter(u => u !== statusUrl));

  for (const url of list) {
    try {
      const res = await fetch(url, { cache: "no-store" });
      if (res.status === 401) { location.href = "/login.html"; return null; }
      if (!res.ok) continue;
      const data = await res.json();          // 不是 JSON 会抛异常，自动跳过
      if (!looksLikeStatus(data)) continue;
      statusUrl = url;
      statusProbed = true;
      return data;
    } catch (e) { /* 继续试下一个 */ }
  }
  statusProbed = true;   // 全失败也别每轮狂刷
  return undefined;      // undefined 表示连不上
}

/* ---------------- LED 控制 ---------------- */
async function tryLedOn(url, on) {
  /* 先用上次成功的格式，失败再逐个试 */
  const order = [ledModeIdx].concat(LED_MODES.map((_, i) => i).filter(i => i !== ledModeIdx));
  const tries = [];
  for (const idx of order) {
    const m = LED_MODES[idx];
    const target = m.query ? url + m.query(on) : url;
    const label = m.method + " " + target;
    try {
      const opt = { method: m.method, cache: "no-store" };
      if (m.ct) opt.headers = { "Content-Type": m.ct };
      if (m.body) opt.body = m.body(on);
      const res = await fetch(target, opt);

      if (res.status === 401) { location.href = "/login.html"; return false; }
      if (!res.ok) { tries.push(label + " → " + res.status); continue; }

      /* 关键：后端即使写文件失败也可能返回 200，必须看响应体里的业务状态 */
      const text = await res.text();
      let data = null;
      try { data = JSON.parse(text); } catch (e) { /* 不是 JSON，当成功处理 */ }

      const bizFail = data && (data.status === "error" || data.ok === false || data.success === false);
      if (bizFail) {
        const why = data.msg || data.message || "业务失败";
        tries.push(label + " → 200 但 " + why);
        if (/permission|denied|权限/i.test(why)) {
          ledDbg("HTTP 通了，但后端写文件被拒：" + why + "\n→ 请用 sudo ./webserver 启动", true);
          return false;
        }
        continue;
      }

      ledModeIdx = idx;
      const ledField = data && data.led ? "，后端回报 led=" + data.led : "";
      ledDbg("成功 " + label + " → " + res.status + ledField);
      return true;
    } catch (e) {
      tries.push(label + " → 网络错误");
    }
  }
  ledDbg("全部失败：" + tries.join("  |  "), true);
  return false;
}

async function toggleLed(on) {
  if (busy) return;
  if (IS_FILE) { setLedUI(on); ledDbg("demo 模式，未发请求"); return; }

  setBusy(true);
  ledDbg("正在请求 " + ledUrl + " …");

  let ok = await tryLedOn(ledUrl, on);

  if (!ok && !ledProbed) {
    const list = [ledUrl].concat(LED_CANDIDATES.filter(u => u !== ledUrl));
    for (const u of list) {
      if (u === ledUrl) continue;
      if (await tryLedOn(u, on)) { ledUrl = u; ok = true; break; }
    }
    ledProbed = true;
  }

  setBusy(false);
  if (ok) {
    setLedUI(on);
  } else {
    toast("控制失败：所有候选接口都没返回 2xx，看下方调试行");
  }
}

/* ---------------- 轮询 ---------------- */
function mock() {
  const t = Date.now() / 1000;
  const base = 396 + Math.sin(t / 3) * 40 + Math.sin(t / 1.3) * 18;
  return {
    cpuFreq: Math.round(Math.max(200, Math.min(650, base))),
    memUsage: 11.1 + Math.sin(t / 9) * 1.4,
    uptime: { seconds: 2 * 3600 + 34 * 60 },
    cpuTemp: null,
    led: ledState
  };
}

async function poll() {
  if (IS_FILE) {
    render(normalize(mock()));
    setConn(true);
    $("foot").textContent = "demo 模式 · 数据为模拟值";
    return;
  }

  const data = await fetchStatus();
  if (data === null) return;              // 已跳转登录页
  if (data === undefined) { setConn(false); return; }

  render(normalize(data));
  setConn(true);
  $("foot").innerHTML = "状态接口 " + statusUrl + " · LED 接口 " + ledUrl +
                        " · 轮询 " + CONFIG.pollMs + "ms";
}

/* ---------------- 事件绑定 ---------------- */
$("btnOn").addEventListener("click", () => toggleLed(true));
$("btnOff").addEventListener("click", () => toggleLed(false));

window.addEventListener("resize", drawChart);

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    clearInterval(pollTimer);
    pollTimer = null;
  } else if (!pollTimer) {
    poll();
    pollTimer = setInterval(poll, CONFIG.pollMs);
  }
});

setLedUI(false);
poll();
pollTimer = setInterval(poll, CONFIG.pollMs);
</script>
</body>
</html>
